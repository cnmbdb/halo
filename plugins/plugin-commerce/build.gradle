plugins {
    id 'java'
    id 'run.halo.plugin.devtools' version "${devtoolsVersion}"
}
group = 'local.halo.commerce'
repositories { mavenCentral() }
dependencies {
    implementation platform("run.halo.tools.platform:plugin:${haloVersion}")
    compileOnly 'run.halo.app:api'
    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
test { useJUnitPlatform() }
halo { version = haloVersion }

processResources {
    from('ui/build/dist') { into 'console' }
    doFirst {
        if (!file('ui/build/dist/main.js').exists()) {
            throw new GradleException('Build the commerce console UI before packaging the plugin')
        }
    }
}
