apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-commerce-products-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/display-name: 商城管理
    rbac.authorization.halo.run/module: 商城
    rbac.authorization.halo.run/ui-permissions: '["commerce:products:manage", "commerce:orders:manage"]'
rules:
  - apiGroups: ["commerce.halo.run"]
    resources: ["products", "productcategories", "orders"]
    verbs: ["get", "list", "create", "update"]
