    - group: beian
      label: 备案设置
      formSchema:
        - $formkit: text
          name: icp_text
          label: ICP备案号
        - $formkit: text
          name: gongan_text
          label: 公安联网备案号
    - group: updates
      label: 独立更新
      formSchema:
        - $cmp: aoste-updates
    - group: plugin
      label: 插件集成
      formSchema:
        - $cmp: commerce-integration
        - $el: h3
          attrs:
            style: "font-size: 16px; font-weight: 600; margin: 0 0 8px; color: #253247;"
          children: 可选插件
        - $el: p
          attrs:
            style: "font-size: 13px; color: #6a7688; margin: 0 0 18px;"
          children: 安装 Docsme 后，可选择文档页面使用的模板。
        - $formkit: group
          name: docsme
          label: Docsme 文档管理
          value:
            source: theme
          children:
            - $formkit: select
              name: source
              label: 模板来源
              options:
                - label: 由此主题提供
                  value: theme
                - label: 使用插件默认模板
                  value: plugin

    - group: commerce_home
      label: 商城首页
      formSchema:
        - $formkit: select
          name: columns
          label: 商品列表列数
          value: "3"
          options:
            - label: 两列
              value: "2"
            - label: 三列
              value: "3"
            - label: 四列
              value: "4"
        - $formkit: array
          name: modules
          label: 首页模块
          help: 四个区块为幻灯片、分类导航、商品网格、图文推广；可排序及关闭。精选商品仅显示勾选精选的商品。
          value:
            - type: banner
              title: ""
              enabled: true
            - type: categories
              title: 商品分类
              enabled: true
            - type: products
              title: 全部商品
              enabled: true
            - type: promotion
              title: ""
              enabled: false
          itemLabels:
            - type: text
              label: "$value.title"
          children:
            - $formkit: select
              name: type
              id: commerce-home-type-36
              key: commerce-home-type-36
              label: 模块类型
              value: products
              options:
                - label: 幻灯片（左大图＋右双图）
                  value: banner
                - label: 分类导航
                  value: categories
                - label: 精选商品
                  value: featured
                - label: 商品网格
                  value: products
                - label: 图文推广
                  value: promotion
            - $formkit: checkbox
              name: enabled
              id: commerce-home-enabled-51
              key: commerce-home-enabled-51
              label: 显示模块
              value: true
            - $formkit: text
              name: title
              id: commerce-home-title-55
              key: commerce-home-title-55
              label: 模块标题
            - $formkit: textarea
              name: description
              id: commerce-home-description-58
              key: commerce-home-description-58
              label: 模块说明
            - $formkit: text
              name: category
              id: commerce-home-category-61
              key: commerce-home-category-61
              if: "$value.type === 'featured' || $value.type === 'products'"
              label: 分类标识
              help: 留空显示全部分类的商品。
            - $formkit: number
              name: limit
              id: commerce-home-limit-66
              key: commerce-home-limit-66
              if: "$value.type === 'featured' || $value.type === 'products'"
              label: 商品数量
              value: 8
              validation: "required|min:1|max:48"
            - $formkit: attachment
              name: image
              id: commerce-home-image-72
              key: commerce-home-image-72
              if: "$value.type === 'promotion'"
              label: 推广图片
            - $formkit: text
              name: link
              id: commerce-home-link-76
              key: commerce-home-link-76
              if: "$value.type === 'promotion'"
              label: 推广链接
            - $formkit: number
              name: left_weight
              id: commerce-banner-left_weight
              key: commerce-banner-left_weight
              if: "$value.type === 'banner'"
              label: 左侧宽度比例
              value: 2
              validation: "required|min:1|max:6"
              help: 与右侧比例组合，默认 2:1。
            - $formkit: number
              name: right_weight
              id: commerce-banner-right_weight
              key: commerce-banner-right_weight
              if: "$value.type === 'banner'"
              label: 右侧宽度比例
              value: 1
              validation: "required|min:1|max:6"
            - $formkit: number
              name: height
              id: commerce-banner-height
              key: commerce-banner-height
              if: "$value.type === 'banner'"
              label: 桌面区块高度（px）
              value: 420
              validation: "required|min:200|max:900"
              help: 手机端自动堆叠，不使用桌面高度。
            - $formkit: number
              name: gap
              id: commerce-banner-gap
              key: commerce-banner-gap
              if: "$value.type === 'banner'"
              label: 图片间距（px）
              value: 16
              validation: "required|min:0|max:48"
            - $formkit: number
              name: top_weight
              id: commerce-banner-top_weight
              key: commerce-banner-top_weight
              if: "$value.type === 'banner'"
              label: 右侧上图高度比例
              value: 1
              validation: "required|min:1|max:6"
              help: 默认上下 1:1。
            - $formkit: number
              name: bottom_weight
              id: commerce-banner-bottom_weight
              key: commerce-banner-bottom_weight
              if: "$value.type === 'banner'"
              label: 右侧下图高度比例
              value: 1
              validation: "required|min:1|max:6"
            - $formkit: number
              name: interval
              id: commerce-banner-interval
              key: commerce-banner-interval
              if: "$value.type === 'banner'"
              label: 自动切换间隔（秒）
              value: 5
              validation: "required|min:0|max:60"
              help: 0 表示不自动切换。
            - $formkit: select
              name: fit
              id: commerce-home-fit-140
              key: commerce-home-fit-140
              if: "$value.type === 'banner' || $value.type === 'promotion'"
              label: 图片适应方式
              value: cover
              options:
                - label: 填满裁剪
                  value: cover
                - label: 完整显示
                  value: contain
            - $formkit: text
              name: mobile_ratio
              id: commerce-home-mobile_ratio-150
              key: commerce-home-mobile_ratio-150
              if: "$value.type === 'banner'"
              label: 手机大图宽高比
              value: "16 / 9"
              validation: 'matches:/^[0-9]+ *\/ *[0-9]+$/'
              help: 例如 16 / 9、4 / 3、1 / 1。
            - $formkit: attachment
              name: top_image
              id: commerce-home-top_image-157
              key: commerce-home-top_image-157
              if: "$value.type === 'banner'"
              label: 右侧上图图片
            - $formkit: text
              name: top_title
              id: commerce-home-top_title-161
              key: commerce-home-top_title-161
              if: "$value.type === 'banner'"
              label: 右侧上图图片说明
            - $formkit: text
              name: top_link
              id: commerce-home-top_link-165
              key: commerce-home-top_link-165
              if: "$value.type === 'banner'"
              label: 右侧上图跳转链接
            - $formkit: attachment
              name: bottom_image
              id: commerce-home-bottom_image-169
              key: commerce-home-bottom_image-169
              if: "$value.type === 'banner'"
              label: 右侧下图图片
            - $formkit: text
              name: bottom_title
              id: commerce-home-bottom_title-173
              key: commerce-home-bottom_title-173
              if: "$value.type === 'banner'"
              label: 右侧下图图片说明
            - $formkit: text
              name: bottom_link
              id: commerce-home-bottom_link-177
              key: commerce-home-bottom_link-177
              if: "$value.type === 'banner'"
              label: 右侧下图跳转链接
            - $formkit: checkbox
              name: new_tab
              id: commerce-home-new_tab-181
              key: commerce-home-new_tab-181
              label: 图片链接在新窗口打开
              value: false
              if: "$value.type === 'banner' || $value.type === 'promotion'"
            - $cmp: commerce-categories
              if: "$value.type === 'categories'"
              key: commerce-home-category-management
            - $formkit: array
              name: slides
              id: commerce-home-slides-186
              key: commerce-home-slides-186
              if: "$value.type === 'banner'"
              label: 左侧大图轮播列表
              help: 可添加多张图片，每张图片独立配置链接；支持自动切换和指示点切换。
              value: []
              itemLabels:
                - type: text
                  label: "$value.title"
              children:
                - $formkit: text
                  name: title
                  id: commerce-home-title-196
                  key: commerce-home-title-196
                  label: 图片标题
                - $formkit: attachment
                  name: image
                  id: commerce-home-image-199
                  key: commerce-home-image-199
                  label: 图片
                  validation: required
                - $formkit: text
                  name: link
                  id: commerce-home-link-203
                  key: commerce-home-link-203
                  label: 跳转链接
    - group: commerce_detail
      label: 商品详情
      formSchema:
        - $formkit: select
          name: gallery_layout
          label: 商品图库布局
          value: left
          options:
            - label: 左图右信息
              value: left
            - label: 上图下信息
              value: top
        - $formkit: checkbox
          name: show_stock
          label: 显示库存
          value: true
        - $formkit: checkbox
          name: show_product_type
          label: 显示实物／数字商品标识
          value: true
        - $formkit: checkbox
          name: sticky_purchase
          label: 固定购买栏
          value: true
        - $formkit: text
          name: purchase_label
          label: 购买按钮文案
          value: 立即购买
        - $formkit: checkbox
          name: show_description
          label: 显示商品说明
          value: true
        - $formkit: checkbox
          name: show_after_sales
          id: show_after_sales
          label: 显示售后说明
          value: true
        - $formkit: textarea
          name: after_sales
          id: after_sales
          key: after_sales
          if: "$get(show_after_sales).value"
          label: 通用售后说明
          value: 请在购买前阅读商品的交付与售后说明。
        - $formkit: checkbox
          name: show_related
          id: show_related
          key: show_related
          label: 显示相关推荐
          value: true
        - $formkit: number
          name: related_limit
          id: related_limit
          key: related_limit
          if: "$get(show_related).value"
          label: 推荐商品数量
          value: 4
          validation: "required|min:1|max:12"
    - group: commerce_products
      label: 商品管理
      formSchema:
        - $cmp: commerce-products
    - group: commerce_orders
      label: 订单管理
      formSchema:
        - $cmp: commerce-orders
    - group: commerce_payment
      label: 支付管理
      formSchema:
        - $cmp: commerce-payment
