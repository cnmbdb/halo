apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-aoset-setting
spec:
  forms:
    - group: layout
      label: 首页布局
      formSchema:
        - $el: details
          attrs:
            open: false
            style: "margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.03);"
          children:
            - $el: summary
              attrs:
                style: "cursor: pointer; padding: 22px 24px; color: #0f172a;"
              children:
                - $el: span
                  attrs:
                    style: "font-size: 17px; font-weight: 650;"
                  children: 幻灯片区块
                - $el: p
                  attrs:
                    style: "margin: 8px 0 0; font-size: 13px; line-height: 1.7; color: #64748b; font-weight: 400;"
                  children: 管理轮播内容、图片与跳转，设置自动播放和展示高度。
            - $el: div
              attrs:
                style: "padding: 4px 24px 24px; border-top: 1px solid #f1f5f9;"
              children:
                - $formkit: checkbox
                  name: slides_enabled
                  label: 显示幻灯片区块
                  value: true
                - $formkit: array
                  name: slides
                  label: 幻灯片内容
                  help: 仅展示图片；无图片的条目不展示。可拖动排序，图片可设置点击跳转。
                  value:
                    - title: 首页图片
                      image: /themes/theme-aoset/screenshot.jpeg
                      link: /archives
                  itemLabels:
                    - type: text
                      label: $value.title
                    - type: text
                      label: $value.link
                  children:
                    - $formkit: text
                      name: title
                      label: 管理名称（前台不显示）
                    - $formkit: attachment
                      name: image
                      label: 图片
                      validation: required
                    - $formkit: text
                      name: link
                      label: 跳转链接
                      help: 支持站内路径或 http(s) 链接。
                - $formkit: checkbox
                  name: slides_autoplay
                  label: 自动轮播
                  value: true
                  help: 鼠标悬停、键盘焦点进入、页面隐藏时暂停；跟随系统减少动态效果设置。
                - $formkit: number
                  name: slides_interval
                  label: 自动轮播间隔（秒）
                  value: 6
                  min: 3
                  max: 30
                  validation: required|number|min:3|max:30
                - $formkit: select
                  name: slides_height
                  label: 幻灯片高度
                  help: 全高度占满视口剩余高度；自适应按当前图片比例完整展示，不裁切。
                  value: comfortable
                  options:
                    - label: 紧凑
                      value: compact
                    - label: 舒展
                      value: comfortable
                    - label: 全高度
                      value: full
                    - label: 自适应
                      value: auto
        - $el: details
          attrs:
            open: false
            style: "margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.03);"
          children:
            - $el: summary
              attrs:
                style: "cursor: pointer; padding: 22px 24px; color: #0f172a;"
              children:
                - $el: span
                  attrs:
                    style: "font-size: 17px; font-weight: 650;"
                  children: 自定义卡片区块
                - $el: p
                  attrs:
                    style: "margin: 8px 0 0; font-size: 13px; line-height: 1.7; color: #64748b; font-weight: 400;"
                  children: 添加图片、GIF 或视频，设置尺寸、展示数量和跳转链接。
            - $el: div
              attrs:
                style: "padding: 4px 24px 24px; border-top: 1px solid #f1f5f9;"
              children:
                - $formkit: checkbox
                  name: cards_enabled
                  label: 显示自定义卡片区块
                  value: true
                - $formkit: select
                  name: cards_columns
                  label: 桌面端卡片列数
                  value: "3"
                  options:
                    - label: 两列
                      value: "2"
                    - label: 三列
                      value: "3"
                    - label: 四列
                      value: "4"
                - $formkit: select
                  name: cards_mobile_columns
                  label: 手机端卡片列数
                  value: "2"
                  help: 仅影响首页自定义卡片，767px 及以下生效，桌面列数独立设置。
                  options:
                    - label: 单列大图
                      value: "1"
                    - label: 双列紧凑
                      value: "2"
                - $formkit: select
                  name: cards_mobile_ratio
                  label: 手机端媒体比例
                  value: auto
                  help: 原图比例完整展示图片和 GIF；固定比例沿用每张卡片的填充方式，视频默认 16:10。
                  options:
                    - label: 原图比例（不裁切）
                      value: auto
                    - label: 横向 16:10
                      value: landscape
                    - label: 正方形 1:1
                      value: square
                    - label: 沿用每张卡片的高度
                      value: desktop
                - $formkit: select
                  name: cards_mobile_gap
                  label: 手机端卡片间距
                  value: "12"
                  options:
                    - label: 紧凑（8px）
                      value: "8"
                    - label: 适中（12px）
                      value: "12"
                    - label: 宽松（18px）
                      value: "18"
                - $formkit: number
                  name: cards_limit
                  label: 展示数量
                  value: 0
                  min: 0
                  max: 100
                  validation: "number|min:0|max:100"
                  help: 0 表示展示全部；按列表顺序展示，可添加、删除或拖动排序。
                - $formkit: array
                  name: cards
                  label: 自定义卡片
                  help: 支持图片、GIF 和视频；每张卡片独立设置尺寸和链接。
                  value:
                    - title: 文章归档
                      description: 沿着时间线，回看每一次记录。
                      link: /archives
                      badge: ARCHIVE
                    - title: 分类浏览
                      description: 找到属于你的兴趣，探索更多可能。
                      link: /categories
                      badge: DISCOVER
                    - title: 标签索引
                      description: 用一个关键词，连接新的灵感。
                      link: /tags
                      badge: INSPIRATION
                  itemLabels:
                    - type: text
                      label: $value.title
                  children:
                    - $formkit: text
                      name: title
                      label: 管理名称（前台不显示）
                      validation: required
                    - $formkit: select
                      name: media_type
                      label: 媒体类型
                      value: image
                      options:
                        - label: 图片 / GIF
                          value: image
                        - label: 视频
                          value: video
                    - $formkit: attachment
                      name: image
                      label: 图片 / GIF
                      help: GIF 使用原始文件地址以保留动画。
                    - $formkit: attachment
                      name: video
                      label: 视频文件
                      help: 推荐浏览器支持的 MP4 或 WebM 文件。
                    - $formkit: attachment
                      name: poster
                      label: 视频封面
                    - $formkit: number
                      name: width
                      label: 卡片宽度（px）
                      value: 0
                      min: 0
                      max: 2560
                      validation: "number|min:0|max:2560"
                      help: 0 自动填满当前列；手机端始终填满所选列宽。
                    - $formkit: number
                      name: height
                      label: 桌面端媒体高度（px）
                      value: 240
                      min: 80
                      max: 1440
                      validation: "number|min:80|max:1440"
                    - $formkit: select
                      name: fit
                      label: 媒体填充方式
                      value: cover
                      options:
                        - label: 裁剪填满
                          value: cover
                        - label: 完整显示
                          value: contain
                    - $formkit: checkbox
                      name: controls
                      label: 显示视频播放控件
                      value: true
                      help: 开启后可操作播放器，通过右上角图标跳转。
                    - $formkit: checkbox
                      name: autoplay
                      label: 视频静音自动播放并循环
                      value: false
                    - $formkit: text
                      name: link
                      label: 跳转链接
                    - $formkit: checkbox
                      name: new_tab
                      label: 在新窗口打开
                      value: false
        - $el: details
          attrs:
            open: false
            style: "margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.03);"
          children:
            - $el: summary
              attrs:
                style: "cursor: pointer; padding: 22px 24px; color: #0f172a;"
              children:
                - $el: span
                  attrs:
                    style: "font-size: 17px; font-weight: 650;"
                  children: 文章分类区块
                - $el: p
                  attrs:
                    style: "margin: 8px 0 0; font-size: 13px; line-height: 1.7; color: #64748b; font-weight: 400;"
                  children: 选择并排序文章分类，设置毛玻璃胶囊按钮的左侧图片。
            - $el: div
              attrs:
                style: "padding: 4px 24px 24px; border-top: 1px solid #f1f5f9;"
              children:
                - $formkit: checkbox
                  name: categories_enabled
                  label: 显示文章分类区块
                  value: true
                - $formkit: array
                  name: category_buttons
                  label: 分类胶囊按钮
                  help: 添加按钮后，首页按此列表顺序展示；每项可选择“全部文章”或指定分类，独立设置图片并拖动排序。列表为空时使用下方自动展示设置。
                  value:
                    - name: 全部
                      type: all
                      title: 全部
                  itemLabels:
                    - type: text
                      label: $value.name
                    - type: text
                      label: $value.title
                  children:
                    - $formkit: text
                      name: name
                      label: 管理名称（前台不显示）
                      value: 分类按钮
                      validation: required
                    - $formkit: select
                      name: type
                      label: 按钮内容
                      value: category
                      options:
                        - label: 指定分类
                          value: category
                        - label: 全部文章
                          value: all
                    - $formkit: categorySelect
                      name: category
                      label: 绑定分类
                      help: 按钮内容选择“指定分类”时选择；“全部文章”无需绑定分类。
                    - $formkit: attachment
                      name: image
                      label: 左侧图片
                      help: 留空使用默认图案。
                    - $formkit: text
                      name: title
                      label: 显示名称
                      help: 留空使用绑定分类的名称；点击后筛选首页下方文章列表。
                - $formkit: categorySelect
                  name: category_names
                  label: 自动展示分类
                  multiple: true
                  value: []
                  help: 留空展示全部分类；按选择顺序展示，移除后重新选择可调整顺序。
                - $formkit: attachment
                  name: categories_image
                  label: 自动展示共用图片
                  help: 留空使用默认图案；显示在胶囊按钮左侧。
        - $el: details
          attrs:
            open: false
            style: "margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.03);"
          children:
            - $el: summary
              attrs:
                style: "cursor: pointer; padding: 22px 24px; color: #0f172a;"
              children:
                - $el: span
                  attrs:
                    style: "font-size: 17px; font-weight: 650;"
                  children: 文章卡片列表
                - $el: p
                  attrs:
                    style: "margin: 8px 0 0; font-size: 13px; line-height: 1.7; color: #64748b; font-weight: 400;"
                  children: 设置文章布局、展示字段和侧边栏，沿用站点文章分页。
            - $el: div
              attrs:
                style: "padding: 4px 24px 24px; border-top: 1px solid #f1f5f9;"
              children:
                - $formkit: checkbox
                  name: posts_enabled
                  label: 显示文章卡片列表
                  value: true
                - $formkit: select
                  name: post_list_layout
                  label: 文章卡片布局
                  value: grid_3
                  options:
                    - label: 网格（一行三列）
                      value: grid_3
                    - label: 网格（一行两列）
                      value: grid_2
                    - label: 横向列表
                      value: single
                  help: 首页每页文章数量沿用 Halo 的文章设置，分页展示全部文章。
                - $formkit: checkbox
                  name: posts_cover
                  label: 显示文章封面
                  value: true
                - $formkit: checkbox
                  name: posts_excerpt
                  label: 显示文章摘要
                  value: true
                - $formkit: checkbox
                  name: posts_date
                  label: 显示发布日期
                  value: true
                - $formkit: checkbox
                  name: posts_sidebar
                  label: 在文章列表右侧显示侧边栏
                  value: false
                  help: 侧边栏内容在「侧边栏」标签页配置，移动端显示在文章列表下方。
        - $el: details
          attrs:
            style: "margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff;"
          children:
            - $el: summary
              attrs:
                style: "cursor: pointer; padding: 18px 22px; font-size: 14px; font-weight: 600; color: #475569;"
              children: 文章页面兼容设置
            - $el: div
              attrs:
                style: "padding: 0 22px 22px;"
              children:
                - $formkit: checkbox
                  name: content_header
                  label: 显示文章页面顶部背景
                  value: true

    - group: global
      label: 全局
      formSchema:
        - $formkit: select
          name: logo_type
          id: logo_type
          label: 菜单栏 Logo 类型
          value: image
          options:
            - label: 文字
              value: text
            - label: 图片
              value: image
        - $formkit: checkbox
          name: show_scroll_button
          label: 显示滚动到顶部按钮
          value: true

    - group: style
      label: 样式
      formSchema:
        - $formkit: select
          name: color_scheme
          label: 默认配色
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 深色
              value: dark
            - label: 浅色
              value: light

        - $formkit: checkbox
          name: enable_change_color_scheme
          label: 允许访客切换配色
          value: true

    - group: post
      label: 文章
      formSchema:
        - $formkit: select
          name: content_style
          label: 内容样式
          value: "github"
          options:
            - label: GitHub 风格
              value: github
            - label: Tailwind CSS Typography
              value: tailwind
        - $formkit: select
          name: title_position
          label: 标题位置
          value: "content"
          options:
            - value: "content"
              label: "正文中"
            - value: "cover"
              label: "封面中"
        - $formkit: text
          name: cover_height
          label: 封面图高度
          value: "24rem"
        - $formkit: checkbox
          name: show_upvote_button
          label: 显示点赞按钮
          value: true
        - $formkit: checkbox
          name: show_share_button
          id: show_share_button
          label: 显示分享按钮
          value: true
        - $formkit: select
          if: $get(show_share_button).value
          name: share_item_ids
          key: share_item_ids
          id: share_item_ids
          multiple: true
          sortable: true
          label: 分享平台
          value:
            - wechat
            - x
            - telegram
            - facebook
            - qq
            - qzone
            - weibo
            - douban
            - native
          options:
            - label: 微信
              value: wechat
            - label: X
              value: x
            - label: Telegram
              value: telegram
            - label: Facebook
              value: facebook
            - label: QQ
              value: qq
            - label: QQ 空间
              value: qzone
            - label: 微博
              value: weibo
            - label: 豆瓣
              value: douban
            - label: 系统分享
              value: native
    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: array
          name: widgets
          label: 小部件
          value:
            - value: popular-posts
            - value: categories
            - value: tags
          itemLabels:
            - type: "text"
              label: "$value.value"
          children:
            - $formkit: select
              name: value
              id: value
              key: value
              label: 部件
              options:
                - label: 站点资料
                  value: profile
                - label: 热门文章
                  value: popular-posts
                - label: 文章分类
                  value: categories
                - label: 文章标签
                  value: tags
            - $formkit: group
              if: "$value.value === profile"
              name: options
              key: profile-options
              id: profile-options
              label: 站点资料选项
              children:
                - $formkit: attachment
                  name: logo
                  label: 站点资料 Logo
                - $formkit: array
                  name: social_media
                  label: 社交媒体
                  value: []
                  itemLabels:
                    - type: "iconify"
                      label: "$value.icon"
                    - type: "text"
                      label: "$value.name"
                    - type: "text"
                      label: "$value.url"
                  children:
                    - $formkit: iconify
                      format: svg
                      name: icon
                      label: 图标
                      validation: "required"
                    - $formkit: text
                      name: name
                      label: 名称
                    - $formkit: text
                      name: url
                      label: 链接
                      validation: "required"
                    - $formkit: select
                      name: url_type
                      label: 链接类型
                      value: normal
                      help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
                      options:
                        - label: 跳转链接
                          value: normal
                        - label: 图片
                          value: image

        - $formkit: group
          name: profile
          help: 已废弃，将在未来的版本移除，请使用上方的站点资料小部件中的配置代替
          value:
            logo:
          children:
            - $formkit: attachment
              name: logo
              label: 站点资料 Logo

        - $formkit: array
          name: social_media
          label: 社交媒体
          value: []
          help: 已废弃，将在未来的版本移除，请使用上方的站点资料小部件中的配置代替
          itemLabels:
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: select
              name: icon
              label: 图标
              options:
                - label: 电子邮箱
                  value: i-tabler-mail
                - label: 微信
                  value: i-simple-icons-wechat
                - label: 腾讯 QQ
                  value: i-simple-icons-tencentqq
                - label: 新浪微博
                  value: i-simple-icons-sinaweibo
                - label: 知乎
                  value: i-simple-icons-zhihu
                - label: 豆瓣
                  value: i-simple-icons-douban
                - label: 哔哩哔哩
                  value: i-simple-icons-bilibili
                - label: 抖音 / TikTok
                  value: i-simple-icons-tiktok
                - label: Telegram
                  value: i-simple-icons-telegram
                - label: Facebook
                  value: i-simple-icons-facebook
                - label: Instagram
                  value: i-simple-icons-instagram
                - label: LinkedIn
                  value: i-simple-icons-linkedin
                - label: Twitter
                  value: i-simple-icons-twitter
                - label: Slack
                  value: i-simple-icons-slack
                - label: Discord
                  value: i-simple-icons-discord
                - label: YouTube
                  value: i-simple-icons-youtube
                - label: Steam
                  value: i-simple-icons-steam
                - label: GitHub
                  value: i-simple-icons-github
                - label: GitLab
                  value: i-simple-icons-gitlab
                - label: RSS
                  value: i-simple-icons-rss
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"
            - $formkit: select
              name: url_type
              label: 链接类型
              value: normal
              help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
              options:
                - label: 跳转链接
                  value: normal
                - label: 图片
                  value: image

    - group: footer
      label: 页脚
      formSchema:
        - $formkit: select
          name: style
          id: style
          key: style
          label: 页脚风格
          value: style_1
          options:
            - label: 风格一
              value: style_1
            - label: 风格二
              value: style_2

        - $formkit: attachment
          name: logo
          label: Logo
          help: 如果不设置，将使用站点设置的 Logo

        - $formkit: text
          name: title
          label: 标题
          help: 如果不设置，将使用站点设置的标题

        - $formkit: textarea
          rows: 3
          name: slogan
          id: slogan
          key: slogan
          if: "$get(style).value === style_2"
          label: 标语

        - $formkit: select
          if: "$get(style).value === style_1"
          name: right_menu
          id: right_menu
          key: right_menu
          label: 右侧菜单
          action: "/api/v1alpha1/menus"
          autoSelect: false
          clearable: true
          requestOption:
            labelField: "spec.displayName"
            valueField: "metadata.name"

        - $formkit: select
          if: "$get(style).value === style_2"
          name: menu_names
          id: menu_names
          key: menu_names
          label: 菜单组
          value: []
          multiple: true
          sortable: true
          action: "/api/v1alpha1/menus"
          requestOption:
            labelField: "spec.displayName"
            valueField: "metadata.name"

        - $formkit: array
          name: social_media
          label: 社交媒体
          value: []
          itemLabels:
            - type: "iconify"
              label: "$value.iconify"
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: iconify
              name: iconify
              label: 图标
              format: svg
              validation: "required"
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"
            - $formkit: select
              name: url_type
              label: 链接类型
              value: normal
