<!doctype html>
<html th:lang="${#locale.toLanguageTag}">
  <head>
    <meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
<link th:unless="${#strings.isEmpty(site.logo)}" rel="preload" th:href="${site.logo}" as="image" />
<script th:inline="javascript">
  window.i18nResources = {
    "jsModule.colorSchemeSwitcher.dark": `[(#{jsModule.colorSchemeSwitcher.dark})]`,
    "jsModule.colorSchemeSwitcher.light": `[(#{jsModule.colorSchemeSwitcher.light})]`,
    "jsModule.colorSchemeSwitcher.auto": `[(#{jsModule.colorSchemeSwitcher.auto})]`,
    "jsModule.share.qzone": `[(#{jsModule.share.qzone})]`,
    "jsModule.share.weibo": `[(#{jsModule.share.weibo})]`,
    "jsModule.share.douban": `[(#{jsModule.share.douban})]`,
    "jsModule.share.wechat": `[(#{jsModule.share.wechat})]`,
    "jsModule.share.native": `[(#{jsModule.share.native})]`,
    "jsModule.share.windowTitle": `[(#{jsModule.share.windowTitle})]`,
    "jsModule.upvote.networkError": `[(#{jsModule.upvote.networkError})]`,
  };
  var colorScheme = /*[[${theme.config.style.color_scheme}]]*/ "system";
  var enableChangeColorScheme = /*[[${theme.config.style.enable_change_color_scheme}]]*/ false;
</script>
<noscript>
  <style>body{display:block!important}</style>
</noscript>


    
    <style>.store-hero{grid-template-columns:minmax(0,var(--left)) minmax(0,var(--right));gap:var(--hero-gap);height:var(--hero-height);display:grid}.store-hero-main{min-width:0;min-height:0;position:relative}.store-hero-side{grid-template-rows:minmax(0,var(--top)) minmax(0,var(--bottom));gap:var(--hero-gap);min-height:0;display:grid}.store-hero-tile{background:#e2e8f0;border-radius:8px;width:100%;height:100%;display:flex;overflow:hidden}.store-hero-tile img{-o-object-fit:var(--image-fit);object-fit:var(--image-fit);width:100%;height:100%}.store-hero-placeholder{color:#64748b;text-align:center;justify-content:center;align-items:center;width:100%;height:100%;padding:20px;display:flex}.store-hero-dots{gap:8px;display:flex;position:absolute;top:20px;right:20px}.store-hero-dots button{opacity:.5;cursor:pointer;background:#fff;border:0;border-radius:3px;width:24px;height:6px}.store-hero-dots button.is-active{opacity:1}@media (width<=640px){.store-hero{grid-template-columns:1fr;height:auto}.store-hero-main{aspect-ratio:var(--mobile-ratio)}.store-hero-side{grid-template-rows:auto;grid-template-columns:1fr 1fr}.store-hero-side .store-hero-tile{aspect-ratio:4/3}}</style>
    <title th:text="|商城 - ${site.title}|"></title>
  
    <script type="module" crossorigin src="/themes/theme-aoset/assets/shop-k8We0Jvf.js"></script>
    <link rel="modulepreload" crossorigin href="/themes/theme-aoset/assets/vendor~archives~author~categories~category~doc-catalog~doc~docs~index~layout~links~moment~m~kzjubayl-BFzsFs5a.js">
    <link rel="modulepreload" crossorigin href="/themes/theme-aoset/assets/main-Dq5Luuj5.js">
    <link rel="stylesheet" crossorigin href="/themes/theme-aoset/assets/vendor~archives~author~categories~category~doc-catalog~doc~docs~index~layout~links~moment~m~kzjubayl-Wb1VPa9d.css">
    <link rel="stylesheet" crossorigin href="/themes/theme-aoset/assets/main-CklXdTjx.css">
  
    <style>/* Square product covers independent of title length. */
.store-product-card{max-width:none}.store-product-link{flex-direction:column}.store-product-cover{width:100%;height:auto;min-height:0;aspect-ratio:1/1;align-self:flex-start}.store-product-copy{width:100%;align-self:stretch}
    </style>
  </head>
  <body class="hidden bg-slate-50 dark:bg-black">
    <header
  id="header-menu"
  class="sticky top-0 z-10 flex h-16 bg-white py-3 shadow-sm transition-all dark:bg-neutral-950"
  x-data="{ open : false }"
  th:with="menu = ${menuFinder.getPrimary()}"
>
  <div class="mx-auto flex h-full w-full max-w-7xl justify-between px-4 lg:px-6">
    <div class="flex h-full items-center gap-6">
      <div class="mr-2 h-full">
        <a href="/" class="inline-flex h-full items-center">
          <img
            th:if="${theme.config.global.logo_type == 'image'} and ${not #strings.isEmpty(site.logo)}"
            th:src="${site.logo}"
            th:alt="Logo"
            class="h-full w-auto"
          />
          <span
            th:if="${theme.config.global.logo_type == 'text'} or ${#strings.isEmpty(site.logo)}"
            id="site-title"
            class="text-lg font-medium text-gray-900 dark:text-neutral-100"
            th:text="${site.title}"
          ></span>
        </a>
      </div>
      <ul th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}" class="hidden items-center gap-8 sm:flex">
        <li
          th:each="menuItem : ${menu.menuItems}"
          class="relative cursor-pointer text-sm font-medium transition-all"
          x-data="dropdown"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <a
            class="text-gray-600 hover:text-blue-600 dark:text-neutral-50 dark:hover:text-neutral-300"
            th:href="@{${menuItem.status.href}}"
            th:text="${menuItem.status.displayName}"
            th:target="${menuItem.spec.target?.value}"
          ></a>
          <ul
            th:if="${not #lists.isEmpty(menuItem.children)}"
            @mouseenter="open()"
            @mouseleave="close()"
            x-show="show"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="menu-dropdown absolute left-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded bg-white shadow dark:divide-neutral-600 dark:bg-neutral-700"
          >
            <li
              th:each="childMenuItem : ${menuItem.children}"
              class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-neutral-600"
            >
              <a
                class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-neutral-50 dark:hover:text-neutral-300"
                th:href="@{${childMenuItem.status.href}}"
                th:text="${childMenuItem.status.displayName}"
                th:target="${childMenuItem.spec.target?.value}"
              ></a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="flex items-center">
      <ul x-data="colorSchemeSwitcher" class="flex items-center gap-4">
        <li class="sm:hidden" x-on:click="open = true">
          <div class="i-tabler-menu-2 text-lg text-gray-600 hover:text-blue-600 dark:text-neutral-100"></div>
        </li>
        <!-- https://github.com/halo-sigs/plugin-search-widget -->
        <li th:if="${pluginFinder.available('PluginSearchWidget')}">
          <button
            type="button"
            onclick="SearchWidget.open()"
            th:aria-label="#{fragment.header.search}"
            class="flex h-10 w-fit min-w-0 items-center gap-2 rounded-xl border border-gray-300 bg-gray-50 px-3 text-sm text-gray-500 transition-colors hover:border-gray-400 hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-400 dark:hover:border-neutral-600 dark:hover:bg-neutral-800 sm:px-3"
          >
            <span class="i-tabler-search shrink-0 text-xl" aria-hidden="true"></span>
            <span class="shrink-0">Type</span>
            <kbd
              class="rounded border border-gray-300 bg-white px-1.5 py-0.5 font-mono text-xs leading-none text-gray-500 dark:border-neutral-600 dark:bg-neutral-800 dark:text-neutral-300"
              >/</kbd
            >
            <span class="shrink-0 whitespace-nowrap">to search</span>
          </button>
        </li>
        <li
          th:if="${theme.config.style.enable_change_color_scheme}"
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div
            class="cursor-pointer text-lg text-gray-600 transition-all hover:text-blue-600 dark:text-neutral-100"
            :class="colorScheme.icon"
          ></div>
          <ul
            @mouseenter="open()"
            @mouseleave="close()"
            x-show="show"
            x-cloak
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="transform opacity-0 scale-95"
            x-transition:enter-end="transform opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-75"
            x-transition:leave-start="transform opacity-100 scale-100"
            x-transition:leave-end="transform opacity-0 scale-95"
            class="absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded bg-white shadow dark:divide-neutral-600 dark:bg-neutral-700"
          >
            <template x-for="colorScheme in colorSchemes">
              <li
                class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 dark:text-neutral-50 dark:hover:bg-neutral-600 dark:hover:text-neutral-300"
                @click="setColorScheme(colorScheme.value,true)"
              >
                <span :class="colorScheme.icon"></span>
                <span x-text="colorScheme.label"></span>
              </li>
            </template>
          </ul>
        </li>
        <li
          x-data="dropdown"
          class="relative cursor-pointer transition-all"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
          @mouseenter="open()"
          @mouseleave="close()"
        >
          <div>
            <div class="size-5 text-gray-600 hover:text-blue-600 dark:text-neutral-100">
              <img
                class="size-5 rounded-full"
                th:src="${currentUser.avatar ?: #theme.assets('/images/default-avatar.svg')}"
                th:alt="${currentUser.displayName}"
              />
            </div>
            <ul
              @mouseenter="open()"
              @mouseleave="close()"
              x-show="show"
              x-cloak
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="transform opacity-0 scale-95"
              x-transition:enter-end="transform opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-75"
              x-transition:leave-start="transform opacity-100 scale-100"
              x-transition:leave-end="transform opacity-0 scale-95"
              class="absolute right-0 z-10 mt-2 w-40 divide-y divide-gray-50 overflow-hidden rounded bg-white shadow dark:divide-neutral-600 dark:bg-neutral-700"
            >
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-neutral-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-neutral-50 dark:hover:text-neutral-300"
                  href="/console"
                  target="_blank"
                  th:text="#{fragment.header.console}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAuthenticated()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-neutral-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-neutral-50 dark:hover:text-neutral-300"
                  href="/logout"
                  th:text="#{fragment.header.logout}"
                >
                </a>
              </li>
              <li
                sec:authorize="isAnonymous()"
                class="flex w-full items-center text-left text-sm hover:bg-gray-50 dark:hover:bg-neutral-600"
              >
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 hover:text-blue-600 dark:text-neutral-50 dark:hover:text-neutral-300"
                  href="/login"
                  onclick="this.href = '/login?redirect_uri=' + encodeURIComponent(window.location.href)"
                  th:text="#{fragment.header.login}"
                >
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}">
    <div
      class="fixed inset-0 z-50 bg-gray-800/40 opacity-100 backdrop-blur-sm dark:bg-black/80"
      aria-hidden="true"
      x-show="open"
      x-cloak
      x-transition:enter="ease-in-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in-out duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
    ></div>
    <div
      class="fixed inset-x-4 top-8 z-50 origin-top scale-100 rounded-lg bg-white p-4 dark:bg-black"
      tabindex="-1"
      x-show="open"
      x-cloak
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-100"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      @click.outside="open = false"
    >
      <div class="flex flex-row-reverse items-center justify-between">
        <button
          class="i-tabler-x p-1 text-xl text-gray-600 dark:text-neutral-300"
          type="button"
          tabindex="0"
          @click="open = false"
        ></button>
        <h2 class="text-sm font-medium text-gray-600 dark:text-neutral-300" th:text="#{fragment.header.menu}"></h2>
      </div>
      <nav class="mt-6">
        <ul class="-my-2 divide-y divide-gray-100 text-sm text-gray-800 dark:divide-neutral-800 dark:text-neutral-100">
          <li th:each="menuItem : ${menu.menuItems}">
            <a
              class="flex items-center justify-between gap-1 py-2"
              th:href="@{${menuItem.status.href}}"
              th:target="${menuItem.spec.target?.value}"
            >
              <span th:text="${menuItem.status.displayName}"></span>
            </a>
            <ul
              class="divide-y divide-gray-100 dark:divide-neutral-800"
              th:if="${not #lists.isEmpty(menuItem.children)}"
            >
              <li th:each="childMenuItem : ${menuItem.children}" class="flex w-full items-center text-left text-sm">
                <a
                  class="size-full truncate px-4 py-2 text-gray-600 dark:text-neutral-200"
                  th:href="@{${childMenuItem.status.href}}"
                  th:text="${childMenuItem.status.displayName}"
                  th:target="${childMenuItem.spec.target?.value}"
                ></a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>


    

    
  
  <main class="mx-auto mt-6 w-full max-w-7xl space-y-10 px-4 lg:px-6" th:with="home=${catalogPresentation.settings(theme.config.get('commerce_home'))}">
    <th:block th:each="module : ${catalogPresentation.modules(home)}" th:if="${module['enabled']}">
      <section class="space-y-5" th:switch="${module['type']}">
        <h2 th:if="${module['type'] != 'banner' and module['type'] != 'categories' and module['type'] != 'products' and not #strings.isEmpty(module['title'])}" class="text-2xl font-semibold text-gray-900 dark:text-neutral-100" th:text="${module['title']}"></h2>
        <p th:if="${module['type'] != 'banner' and not #strings.isEmpty(module['description'])}" class="text-gray-600 dark:text-neutral-300" th:text="${module['description']}"></p>
        <div th:case="banner" class="store-hero"
          th:style="|--left:${module['left_weight'] ?: 2}fr;--right:${module['right_weight'] ?: 1}fr;--hero-height:${module['height'] ?: 420}px;--hero-gap:${module['gap'] ?: 16}px;--top:${module['top_weight'] ?: 1}fr;--bottom:${module['bottom_weight'] ?: 1}fr;--image-fit:${module['fit'] == 'contain' ? 'contain' : 'cover'};--mobile-ratio:${module['mobile_ratio'] ?: '16 / 9'}|"
          x-data="{ active: 0, count: 0, timer: null, init() { this.count = this.$el.querySelectorAll('[data-slide]').length; const seconds = Number(this.$el.dataset.interval); if (this.count > 1 &amp;&amp; seconds > 0) this.timer = setInterval(() => { if (!this.$el.matches(':hover') &amp;&amp; !this.$el.contains(document.activeElement)) this.active = (this.active + 1) % this.count }, seconds * 1000) }, destroy() { clearInterval(this.timer) } }"
          th:data-interval="${module['interval'] ?: 0}">
          <div class="store-hero-main">
            <a th:each="slide, status : ${module['slides']}" data-slide
              th:x-show="|active === ${status.index}|" th:style="${status.index > 0 ? 'display:none' : ''}"
              th:href="${#strings.isEmpty(slide['link']) ? null : slide['link']}"
              th:target="${module['new_tab'] == true ? '_blank' : null}" rel="noopener noreferrer"
              class="store-hero-tile">
              <img th:if="${not #strings.isEmpty(slide['image'])}" th:src="${slide['image']}" th:alt="${slide['title'] ?: ''}" />
              <span th:if="${#strings.isEmpty(slide['image'])}" class="store-hero-placeholder">主展示图</span>
            </a>
            <div th:if="${#lists.isEmpty(module['slides'])}" class="store-hero-tile store-hero-placeholder">主展示图</div>
            <div th:if="${#lists.size(module['slides']) > 1}" class="store-hero-dots" aria-label="幻灯片切换">
              <button th:each="slide, status : ${module['slides']}" type="button"
                th:aria-label="|切换到第 ${status.count} 张幻灯片|" th:x-on:click="|active = ${status.index}|"
                th:x-bind:aria-pressed="|active === ${status.index}|" th:x-bind:class="|{ 'is-active': active === ${status.index} }|"></button>
            </div>
          </div>
          <div class="store-hero-side">
            <a th:each="side : ${ {'top', 'bottom'} }" class="store-hero-tile"
              th:href="${#strings.isEmpty(module[side + '_link']) ? null : module[side + '_link']}"
              th:target="${module['new_tab'] == true ? '_blank' : null}" rel="noopener noreferrer">
              <img th:if="${not #strings.isEmpty(module[side + '_image'])}" th:src="${module[side + '_image']}" th:alt="${module[side + '_title'] ?: ''}" />
              <span th:if="${#strings.isEmpty(module[side + '_image'])}" class="store-hero-placeholder" th:text="${side == 'top' ? '上方展示图' : '下方展示图'}"></span>
            </a>
          </div>
        </div>
        <div th:case="categories" class="flex flex-wrap gap-3">
          <a th:each="category : ${productCategories}" th:href="@{/shop(category=${category.metadata.name})}" class="store-category" style="backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px)"
            th:with="icons=${module['category_images']}, matches=${icons == null ? null : icons.?[#this['category'] == #vars.category.metadata.name]}, categoryImage=${category.metadata.annotations?.get('commerce.halo.run/category-image') ?: (matches != null and not #lists.isEmpty(matches) ? matches[0]['image'] : null)}">
            <img th:if="${not #strings.isEmpty(categoryImage)}"
              th:src="${categoryImage}" alt="" loading="lazy" class="store-category-image" />
            <span th:text="${category.spec.title}"></span>
          </a>
        </div>
        <a th:if="${not #strings.isEmpty(module['image'])}" th:target="${module['new_tab'] == true ? '_blank' : null}" rel="noopener noreferrer" th:case="promotion" th:href="${module['link'] ?: '/shop'}" class="block">
          <img th:if="${module['image'] != null}" th:src="${module['image']}" th:alt="${module['title']}" class="w-full rounded-xl" />
        </a>
        <div th:case="*" class="grid grid-cols-1 gap-6 sm:grid-cols-2" th:classappend="${home?.get('columns') == '4' ? 'lg:grid-cols-4' : (home?.get('columns') == '2' ? '' : 'lg:grid-cols-3')}">
          <th:block th:each="item : ${catalogPresentation.select(products, module)}">
            <article class="store-product-card overflow-hidden rounded-xl bg-white shadow-sm dark:bg-neutral-950">
              <a class="store-product-link" th:href="@{/shop/products/{slug}(slug=${item.slug})}">
                <div class="store-product-cover">
                  <img th:if="${not #lists.isEmpty(item.images)}" th:src="${item.images[0]}" th:alt="${item.title}" loading="lazy" />
                  <span th:if="${#lists.isEmpty(item.images)}" class="store-product-placeholder" aria-label="暂无商品图片">暂无图片</span>
                </div>
                <div class="store-product-copy space-y-3">
                  <h3 class="text-lg font-medium text-gray-900 dark:text-neutral-100" th:text="${item.title}"></h3>
                  <p th:if="${not #lists.isEmpty(item.skus)}" class="text-xl font-semibold text-blue-600" th:text="|¥${#numbers.formatDecimal(item.skus[0].priceMinor / 100.0, 1, 2)}|"></p>
                </div>
              </a>
            </article>
          </th:block>
        </div>
      </section>
    </th:block>
    <p th:if="${#lists.isEmpty(products)}" class="rounded-xl bg-white p-12 text-center text-gray-500 dark:bg-neutral-950">暂无上架商品</p>
  </main>


    <footer th:if="${theme.config.footer.style == 'style_1'}" class="mt-10 bg-white py-8 dark:bg-neutral-950">
  <div class="space-y-1">
    <span
      class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-neutral-300 lg:px-6"
      th:if="${not #strings.isEmpty(theme.config.beian.icp_text)}"
    >
      <a
        href="https://beian.miit.gov.cn/"
        class="inline-flex items-center justify-center gap-1 hover:underline"
        target="_blank"
      >
        <img th:src="@{/assets/images/icp.webp}" class="size-4" alt="ICP备案" />
        <span th:text="${theme.config.beian.icp_text}"></span>
      </a>
    </span>
    <div
      th:if="${not #strings.isEmpty(theme.config.beian.gongan_text)}"
      class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-neutral-300 lg:px-6"
    >
      <p class="flex items-center justify-center gap-1">
        <img th:src="@{/assets/images/gongan.png}" class="size-4" alt="公安备案" />
        <a
          id="gongan-link-1"
          href="https://beian.mps.gov.cn/#/query/webSearch"
          class="hover:underline"
          target="_blank"
          th:text="${theme.config.beian.gongan_text}"
        ></a>
      </p>
    </div>
    <div class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-neutral-300 lg:px-6">
      <th:block th:if="${#strings.isEmpty(theme.config.footer.custom_copyright)}">
        ©
        <th:block th:text="${#dates.format(new java.util.Date().getTime(), 'yyyy')}" />
        <a href="/" class="hover:underline" th:text="${site.title}"></a>. All Rights Reserved. Powered by
        <a href="https://halo.run" class="hover:underline" target="_blank">Halo</a>.
      </th:block>
      <th:block
        th:unless="${#strings.isEmpty(theme.config.footer.custom_copyright)}"
        th:utext="${theme.config.footer.custom_copyright}"
      >
      </th:block>
    </div>
    <span class="mx-auto block max-w-7xl px-4 text-center text-sm text-gray-500 dark:text-neutral-300 lg:px-6">
      <halo:footer />
    </span>
  </div>
</footer>

<footer th:if="${theme.config.footer.style == 'style_2'}" class="mt-10 bg-white py-8 dark:bg-neutral-950">

<script>
  // Extract gongan beian number from text and construct MPS query URL
  (function () {
    const link = document.querySelector('[id^="gongan-link-"]');
    if (!link) return;
    const text = link.textContent || "";
    const match = text.match(/\d+/);
    if (match) {
      link.href = "https://beian.mps.gov.cn/#/query/webSearch?code=" + match[0];
    }
  })();
</script>
