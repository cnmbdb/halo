services:
  halo:
    image: halohub/halo:2.26
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SPRING_THYMELEAF_CACHE: "false"
      JVM_OPTS: "-Xms256m -Xmx768m"
      HALO_PLUGIN_RUNTIME_MODE: development
      HALO_PLUGIN_FIXED_PLUGIN_PATH: /workspace/plugins/plugin-commerce
      COMMERCE_EPAY_SUBMIT_URL: ${COMMERCE_EPAY_SUBMIT_URL:-}
      COMMERCE_EPAY_MERCHANT_ID: ${COMMERCE_EPAY_MERCHANT_ID:-}
      COMMERCE_EPAY_MERCHANT_KEY: ${COMMERCE_EPAY_MERCHANT_KEY:-}
      COMMERCE_EPAY_NOTIFY_URL: ${COMMERCE_EPAY_NOTIFY_URL:-}
      COMMERCE_EPAY_RETURN_URL: ${COMMERCE_EPAY_RETURN_URL:-}
      COMMERCE_EPAY_SITE_NAME: ${COMMERCE_EPAY_SITE_NAME:-}
    command:
      - --halo.external-url=http://localhost:8090/
    volumes:
      - theme-dev-data:/root/.halo2
      - ./themes:/root/.halo2/themes
      - ./plugins:/workspace/plugins
      - ./development/plugin-commerce-enabled.yaml:/workspace/plugins/plugin-commerce/build/resources/main/plugin.yaml:ro
    restart: unless-stopped
  cftun:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - .env.cftun.local
    network_mode: service:halo
    depends_on:
      - halo
    restart: unless-stopped
volumes:
  theme-dev-data:
