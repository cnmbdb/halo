name: Publish AOSTE release
on:
  push:
    branches: [aotes]
    paths: [release/version.json]
permissions:
  contents: write
concurrency:
  group: aoste-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python release/build.py
      - run: python release/test-package.py
      - run: java release/VerifyClasspath.java dist/plugin-commerce-$(python -c 'import json; print(json.load(open("release/version.json"))["plugin"])').jar
      - name: Verify shipped updater
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          v = json.loads(Path('release/version.json').read_text())
          with ZipFile(f'dist/plugin-commerce-{v["plugin"]}.jar') as jar:
              Path('dist/plugin-main.js').write_bytes(jar.read('console/main.js'))
          PY
          node --check dist/plugin-main.js
          node release/test-updates.cjs dist/plugin-main.js
      - name: Publish packages
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("release/version.json"))["theme"])')
          gh release create "aoste-v$VERSION" "dist/theme-aoset-$VERSION.zip" dist/plugin-commerce-*.jar dist/updates.json "dist/AOSTE-$VERSION-with-commerce-plugin.zip" --target "$GITHUB_SHA" --title "AOSTE $VERSION · 移动端首页布局与后台设置" --notes-file dist/notes.md --latest
          gh api "repos/$GH_REPO/releases/tags/aoste-v$VERSION" > dist/published-release.json
      - name: Refresh static update source
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          v = json.loads(Path('release/version.json').read_text())
          text = text.replace(v['baseTheme'], v['theme'])
          text = re.sub(r'(AOSTE-|theme-aoset-)\d+\.\d+\.\d+', lambda m: m[1] + v['theme'], text)
          text = text.replace(v.get('basePlugin', v['plugin']), v['plugin'])
          data = json.loads(Path('dist/published-release.json').read_text())
          public = {key: data[key] for key in ('tag_name','html_url','draft','prerelease','body','assets')}
          marker = '<!-- aoste-release-source\n' + json.dumps(public, ensure_ascii=False, indent=2) + '\n-->'
          text, count = re.subn(r'<!-- aoste-release-source\n.*?\n-->', lambda _: marker, text, flags=re.S)
          assert count == 1
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Publish static update source for AOSTE release"
          git push origin HEAD:aotes
