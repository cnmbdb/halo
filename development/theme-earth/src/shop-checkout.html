<include src="layout.html">
  <template name="head">
    <meta th:if="${_csrf != null}" name="commerce-csrf-token" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="commerce-csrf-header" th:content="${_csrf.headerName}" />
    <script type="module" src="/assets/commerce.ts"></script>
    <title th:text="|确认商品 - ${site.title}|"></title>
  </template>
  <main class="mx-auto mt-6 w-full max-w-4xl space-y-6 px-4 lg:px-6" data-commerce-checkout th:attr="data-shipping-required=${quote.requiresShipping}">
    <a href="/shop" class="text-sm text-gray-500">返回商城</a>
    <section class="space-y-5 rounded-xl bg-white p-6 dark:bg-neutral-950">
      <h1 class="text-2xl font-semibold dark:text-neutral-100">确认商品</h1>
      <div th:each="line : ${quote.lines}" class="flex flex-wrap justify-between gap-4 border-b border-gray-200 pb-4 dark:border-neutral-700">
        <div><h2 class="font-medium dark:text-neutral-100" th:text="${line.productTitle}"></h2><p class="mt-2 text-sm text-gray-500" th:text="|${line.skuTitle} × ${line.quantity}|"></p></div>
        <p class="text-xl font-semibold text-blue-600" th:text="|¥${#numbers.formatDecimal(line.totalMinor / 100.0, 1, 2)}|"></p>
      </div>
      <p class="text-right text-xl font-semibold dark:text-neutral-100" th:text="|合计 ¥${#numbers.formatDecimal(quote.totalMinor / 100.0, 1, 2)}|"></p>
      <p class="text-sm text-gray-500" th:text="${quote.requiresShipping ? '此订单包含实物商品，下单时需要填写收货地址。' : '此订单包含数字商品，付款后交付。'}"></p>
      <form data-order-create class="space-y-4">
        <fieldset th:if="${quote.requiresShipping}" data-shipping-fields class="grid gap-4 rounded-lg border border-gray-200 p-4 dark:border-neutral-700">
          <legend class="px-2">收货信息</legend>
          <label class="grid gap-2 text-sm">收件人<input name="recipient" required maxlength="80" autocomplete="name" class="rounded border border-gray-300 px-3 py-2 dark:bg-neutral-950" /></label>
          <label class="grid gap-2 text-sm">联系电话<input name="phone" required maxlength="32" autocomplete="tel" class="rounded border border-gray-300 px-3 py-2 dark:bg-neutral-950" /></label>
          <label class="grid gap-2 text-sm">收货地址<textarea name="address" required maxlength="500" autocomplete="street-address" class="rounded border border-gray-300 px-3 py-2 dark:bg-neutral-950"></textarea></label>
        </fieldset>
        <p data-order-message role="status" class="text-sm text-gray-500"></p>
        <button data-create-order type="submit" class="w-full rounded-lg bg-blue-600 px-6 py-3 font-medium text-white">创建订单</button>
      </form>
      <p class="text-sm text-gray-500">创建订单后可在订单页查看付款入口与订单状态。待付款订单会保留库存 15 分钟。</p>
    </section>
  </main>
</include>
