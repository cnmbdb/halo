<include src="layout.html">
  <template name="head">
    <script type="module" src="/assets/commerce.ts"></script>
    <title th:text="|购物车 - ${site.title}|"></title>
  </template>
  <main class="mx-auto mt-6 w-full max-w-4xl space-y-6 px-4 lg:px-6" data-commerce-cart>
    <a href="/shop" class="text-sm text-gray-500">继续选购</a>
    <section class="space-y-5 rounded-xl bg-white p-6 dark:bg-neutral-950">
      <h1 class="text-2xl font-semibold dark:text-neutral-100">购物车</h1>
      <noscript>请启用 JavaScript 查看购物车；也可从商品页直接进入确认预览。</noscript>
      <div data-cart-items class="space-y-4"></div>
      <p data-cart-status role="status" class="text-sm text-gray-500"></p>
      <p data-cart-total class="text-right text-xl font-semibold dark:text-neutral-100"></p>
      <button data-cart-checkout disabled class="w-full rounded-lg bg-blue-600 px-6 py-3 font-medium text-white disabled:opacity-50">确认商品</button>
      <p class="text-sm text-gray-500">购物车保存在当前浏览器；价格与库存以服务器报价为准。</p>
    </section>
  </main>
</include>
