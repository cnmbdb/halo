<include src="layout.html">
  <template name="head">
    <meta th:if="${_csrf != null}" name="commerce-csrf-token" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="commerce-csrf-header" th:content="${_csrf.headerName}" />
    <script type="module" src="/assets/commerce.ts"></script>
    <title th:text="|我的订单 - ${site.title}|"></title>
  </template>
  <main class="mx-auto mt-6 w-full max-w-5xl space-y-6 px-4 lg:px-6" data-commerce-orders>
    <a href="/shop" class="text-sm text-gray-500">继续购物</a>
    <h1 class="text-2xl font-semibold dark:text-neutral-100">我的订单</h1>
    <p data-order-message role="status" class="text-sm text-gray-500"></p>
    <p th:if="${#lists.isEmpty(orders)}" class="rounded-xl bg-white p-8 text-gray-500 dark:bg-neutral-950">暂无订单</p>
    <article th:each="order : ${orders}" class="space-y-4 rounded-xl bg-white p-6 dark:bg-neutral-950">
      <header class="flex flex-wrap justify-between gap-2">
        <span class="text-sm text-gray-500" th:text="${order.metadata.name}"></span>
        <span class="text-sm" th:with="labels=${ {'AWAITING_PAYMENT':'待付款','PAID':'已付款','CANCELLED':'已取消','EXPIRED':'已过期','FULFILLING':'处理中','COMPLETED':'已完成','REFUND_REQUIRED':'待退款','REFUNDED':'已退款','RESERVATION_FAILED':'库存预留失败'} }" th:text="${labels[order.spec.state.name()] ?: order.spec.state}"></span>
      </header>
      <div th:each="line : ${order.spec.lines}" class="flex justify-between gap-4 border-b border-gray-200 py-3 dark:border-neutral-700">
        <span th:text="|${line.productTitle} · ${line.skuTitle} × ${line.quantity}|"></span>
        <span th:text="|¥${#numbers.formatDecimal(line.totalMinor / 100.0, 1, 2)}|"></span>
      </div>
      <p th:if="${order.spec.shippingAddress != null}" class="text-sm text-gray-500"
         th:text="|收件人：${order.spec.shippingAddress.recipient} ${order.spec.shippingAddress.phone} ${order.spec.shippingAddress.address}|"></p>
      <div th:if="${order.spec.state.name() != 'CANCELLED' and order.spec.state.name() != 'EXPIRED' and order.spec.state.name() != 'AWAITING_PAYMENT'}" th:each="fulfillment : ${order.spec.fulfillment}" class="text-sm text-gray-500">
        <span th:with="line=${order.spec.lines[fulfillment.lineIndex]}"
          th:text="|${line.productTitle} · ${line.skuTitle}：${fulfillment.state}|"></span>
        <span th:if="${fulfillment.trackingNumber != null}"
          th:text="|${fulfillment.carrier} · ${fulfillment.trackingNumber}|"></span>
      </div>
      <p class="text-right font-semibold" th:text="|合计 ¥${#numbers.formatDecimal(order.spec.totalMinor / 100.0, 1, 2)}|"></p>
      <div th:if="${digitalOrderNames != null and digitalOrderNames.contains(order.metadata.name)}" class="space-y-2">
        <button type="button" data-digital-delivery th:attr="data-order=${order.metadata.name}"
          class="rounded border border-gray-300 px-4 py-2 text-sm">查看数字商品</button>
        <div data-digital-result class="space-y-2 text-sm" aria-live="polite"></div>
      </div>
      <div th:if="${order.spec.state.name() == 'AWAITING_PAYMENT'}" class="space-y-3">
        <p class="text-sm font-semibold">选择支付方式</p>
        <div class="flex flex-wrap gap-3">
        <a th:if="${alipayEnabled}" th:href="@{/shop/api/orders/{name}/payment(name=${order.metadata.name}, type='alipay')}" class="rounded bg-blue-600 px-4 py-2 text-sm text-white">支付宝</a>
        <a th:if="${wxpayEnabled}" th:href="@{/shop/api/orders/{name}/payment(name=${order.metadata.name}, type='wxpay')}" class="rounded bg-green-600 px-4 py-2 text-sm text-white">微信支付</a>
        <a th:if="${usdtEnabled}" th:href="@{/shop/api/orders/{name}/payment(name=${order.metadata.name}, type='usdt')}" class="rounded bg-teal-600 px-4 py-2 text-sm text-white">USDT · TRC20</a>
        </div>
      </div>
      <p th:if="${order.spec.state.name() == 'AWAITING_PAYMENT' and !paymentConfigured}" class="text-sm text-amber-700">支付渠道尚未配置，请联系商家完成设置后再付款。</p>
      <button th:if="${order.spec.state.name() == 'AWAITING_PAYMENT'}" type="button" data-cancel-order
        th:attr="data-order=${order.metadata.name}" class="rounded border border-gray-300 px-4 py-2 text-sm">取消订单</button>
    </article>
  </main>
</include>
